name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: skip reviews for changes that carry no code.
    # paths-ignore:
    #   - "**/*.md"
    #   - ".github/**"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: |
      github.event.pull_request.user.login == 'exqzmepls' &&
      github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/Aaronontheweb/dotnet-skills.git
          plugins: |
            code-review@claude-code-plugins
            dotnet-skills@dotnet-skills

          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Post every confirmed issue as an inline review comment on the
            offending line with mcp__github_inline_comment__create_inline_comment,
            rather than only linking to it from the summary comment.

            Always post the top-level summary comment, including when no issues
            were found.

          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(git rev-parse:*)"
