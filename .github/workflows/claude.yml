name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for Claude to push its branch
      pull-requests: write # Required for Claude to open PRs and comment
      issues: write # Required for Claude to reply on the issue
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # The skills CLAUDE.md routes .NET work to. Without this the marketplace
          # is not installed on the runner and .claude/settings.json enables nothing.
          plugin_marketplaces: |
            https://github.com/Aaronontheweb/dotnet-skills.git
          plugins: |
            dotnet-skills@dotnet-skills

          # There is no interactive user in a workflow run, so anything that would
          # prompt is denied outright. --permission-mode auto lets everything run and
          # has a classifier vet each action instead; the allow rules below stay
          # useful because a rule match skips that extra round-trip. Auto mode needs
          # Sonnet 4.6+/Opus 4.6+/Fable 5, hence the explicit --model.
          claude_args: |
            --permission-mode auto
            --model claude-opus-5
            --allowedTools "Bash(dotnet:*),Bash(git:*),Bash(gh:*),WebFetch,WebSearch"
            --max-turns 40

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

